# Schema for triage-pdf's First Division registry.
#
# "First Division" is the universal term for the user's top-level classifier
# dimension. Each user names entries in their First Division per their own
# User Ontology — common names: axis, project, matter, domain, client, topic.
#
# The top-level yaml key below is shown as "first_division". The skill accepts
# this as the canonical key and does not require renaming. The per-entry "name"
# is whatever the User Ontology declares.
#
# Copy to the path declared by your User Ontology (the skill asks at first run)
# and fill in. The skill READS this file; it never writes to it.

first_division:
  - name: <name as declared in your User Ontology>
    archive_roots:
      - <path to canonical archive>
      # - <path to mirror archive, if any>
    dup_stash:
      - <path to dup-stash folder for this entry>
    content_keywords:
      - <keyword that uniquely identifies this entry in document text>
      # ...
    subfolder_rules:                            # optional
      - match_keywords: [<doc-type keywords>]
        subfolder: <relative path under archive_root, may use {YYYY}>
        subfolder_alt: <relative path under the mirror archive_root, if it differs>
